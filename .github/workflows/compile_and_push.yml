name: 🚀 Remote Compile Case Offline Data Only

on:
  workflow_dispatch:
    inputs:
      filter_mode:
        description: 'เลือกโหมดการ Compile'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'cases'
          - 'keyword'
          - 'category'
          - 'source'
      filter_query:
        description: 'คำค้นหา/รหัสเคส (เช่น OSPE-CL83M101 หรือ Dosage form หรือ Product)'
        required: false
        default: ''
        type: string
      commit_msg:
        description: 'ข้อความกำกับ Git Commit'
        required: false
        default: 'Auto sync case offline data from Google Sheets'
        type: string

jobs:
  compile_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ⚙️ Compile Case Data from Google Sheets
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY || secrets.COMPILE_AND_PUSH }}
        run: |
          python scripts/compile_offline_db_python.py --mode "${{ github.event.inputs.filter_mode }}" --query "${{ github.event.inputs.filter_query }}" --web-dir "."

      - name: 🚀 Commit & Push ONLY Case Offline Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # สั่ง Stage เฉพาะ 2 ไฟล์เคสเท่านั้น ไม่แตะไฟล์อื่นเด็ดขาด
          git add case-data-offline.js case-details-offline.js
          if git diff --staged --quiet; then
            echo "No case data changes detected to commit."
          else
            git commit -m "${{ github.event.inputs.commit_msg }} [mode: ${{ github.event.inputs.filter_mode }}, query: '${{ github.event.inputs.filter_query }}']"
            git push origin main
          fi
